name: Daily news and Pages

on:
  schedule:
    # 毎朝6:17ごろ（日本時間）。混雑で遅れる場合があります。
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/daily-news.json'
      - 'data/walker-news.json'
      - 'data/domingo-news.json'
      - 'data/sasaru-news.json'
      - 'data/hidaka-events.json'
      - '*.md'

concurrency:
  group: biratori-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect Domingo news
        id: domingo
        continue-on-error: true
        run: node scripts/update-domingo-news.mjs
      - name: Collect Walker Hokkaido outings
        id: walker
        continue-on-error: true
        run: node scripts/update-walker-news.mjs
      - name: Collect SASARU categories
        id: sasaru
        continue-on-error: true
        run: node scripts/update-sasaru-news.mjs
      - name: Collect Hidaka events
        id: hidaka
        continue-on-error: true
        run: node scripts/update-hidaka-events.mjs
      - name: Save collected news
        if: steps.domingo.outcome == 'success' || steps.walker.outcome == 'success' || steps.sasaru.outcome == 'success' || steps.hidaka.outcome == 'success'
        run: |
          git add data/domingo-news.json
          if [ -f data/sasaru-news.json ]; then git add data/sasaru-news.json; fi
          if [ -f data/walker-news.json ]; then git add data/walker-news.json; fi
          if [ -f data/hidaka-events.json ]; then git add data/hidaka-events.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update daily news digest'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R data _site/data
          if [ -f background.jpg ]; then cp background.jpg _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
