name: Daily news and Pages

on:
  schedule:
    # 日本時間の6時・12時・18時・22時。混雑で遅れる場合があります。
    - cron: '0 3,9,13,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/daily-news.json'
      - 'data/walker-news.json'
      - 'data/domingo-news.json'
      - 'data/sasaru-news.json'
      - 'data/hidaka-events.json'
      - 'data/gutabi-events.json'
      - 'data/x-posts.json'
      - 'data/bing-wallpaper.json'
      - 'data/widget-feeds.json'
      - '*.md'

concurrency:
  group: biratori-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test feed collection
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Collect RSS feeds and link update notices
        id: feeds
        continue-on-error: true
        run: python3 scripts/update-widget-feeds.py
      - name: Update Bing wallpaper
        id: wallpaper
        continue-on-error: true
        run: node scripts/update-bing-wallpaper.mjs
      - name: Collect Domingo news
        id: domingo
        continue-on-error: true
        run: node scripts/update-domingo-news.mjs
      - name: Collect Walker Hokkaido outings
        id: walker
        continue-on-error: true
        run: node scripts/update-walker-news.mjs
      - name: Collect SASARU categories
        id: sasaru
        continue-on-error: true
        run: node scripts/update-sasaru-news.mjs
      - name: Collect Hidaka events
        id: hidaka
        continue-on-error: true
        run: node scripts/update-hidaka-events.mjs
      - name: Collect monthly Gutabi events
        id: gutabi
        continue-on-error: true
        run: node scripts/update-gutabi-events.mjs
      - name: Set up Python for X
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect X posts
        id: xposts
        continue-on-error: true
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          if [ -n "$TWITTER_AUTH_TOKEN" ] && [ -n "$TWITTER_CT0" ]; then
            python -m pip install twitter-cli==0.8.5
          fi
          python scripts/update-x-posts.py
      - name: Save collected news
        if: steps.feeds.outcome == 'success' || steps.wallpaper.outcome == 'success' || steps.domingo.outcome == 'success' || steps.walker.outcome == 'success' || steps.sasaru.outcome == 'success' || steps.hidaka.outcome == 'success' || steps.gutabi.outcome == 'success' || steps.xposts.outcome == 'success'
        run: |
          if [ -f data/bing-wallpaper.json ]; then git add data/bing-wallpaper.json; fi
          if [ -f data/widget-feeds.json ]; then git add data/widget-feeds.json; fi
          git add data/domingo-news.json
          if [ -f data/x-posts.json ]; then git add data/x-posts.json; fi
          if [ -f data/sasaru-news.json ]; then git add data/sasaru-news.json; fi
          if [ -f data/walker-news.json ]; then git add data/walker-news.json; fi
          if [ -f data/hidaka-events.json ]; then git add data/hidaka-events.json; fi
          if [ -f data/gutabi-events.json ]; then git add data/gutabi-events.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update daily news digest'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R data _site/data
          if [ -f background.jpg ]; then cp background.jpg _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

