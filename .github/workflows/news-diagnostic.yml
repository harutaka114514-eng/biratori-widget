name: News collection diagnostic
on:
  pull_request:
    paths:
      - scripts/update-widget-feeds.py
      - tests/test_widget_feeds.py
      - .github/workflows/news-diagnostic.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test fallback logic
        run: python3 -m unittest discover -s tests -p 'test_widget_feeds.py'
      - name: Check actual sources
        run: python3 scripts/update-widget-feeds.py
