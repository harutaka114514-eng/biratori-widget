name: Update Hidaka road restrictions
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_hidaka_road.py
      - .github/workflows/hidaka-road.yml
permissions:
  contents: write
concurrency:
  group: hidaka-road
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/update_hidaka_road.py
      - name: Save road status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hidaka-road.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Hidaka road restrictions"
            git pull --rebase
            git push
          fi
