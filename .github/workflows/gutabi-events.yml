name: Monthly Gutabi events
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch event calendar
        run: |
          mkdir -p work
          curl --fail --location --max-time 45 'https://www.gutabi.jp/event/area?w%5Bsp_i__a%5D%5B%5D=5&w%5Bsp_i__a%5D%5B%5D=9&button=' -o work/gutabi.html
      - name: Inspect calendar markup
        run: |
          sed -n '240,365p' work/gutabi.html
      - uses: actions/upload-artifact@v4
        with:
          name: gutabi-source
          path: work/gutabi.html
